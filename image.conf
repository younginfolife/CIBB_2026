# ---------------------------------------------------------------------------
# Where the prebuilt images live.
# Must be all lowercase and must match owner/repository on GitHub, because the
# GitHub Action publishes to ghcr.io/<owner>/<repository>.
# ---------------------------------------------------------------------------
IMAGE_REPO=ghcr.io/younginfolife/cibb_2026

# tags produced by the GitHub Action
TAG_STD=latest
TAG_DIND=dind

# versions used only when building locally (./start.sh --build)
R_VERSION=4.6.1
DIND_IMAGE=docker:29-dind
