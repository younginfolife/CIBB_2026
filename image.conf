# ---------------------------------------------------------------------------
# Where the prebuilt images live. This is the ONLY file to edit after you
# create the GitHub repository.
#
# The name must be all lowercase and must match owner/repository on GitHub,
# because the CI workflow publishes to  ghcr.io/<owner>/<repository>.
#
# Example: repository  github.com/kendomaniac/rnaseq-nets
#          ->  IMAGE_REPO=ghcr.io/kendomaniac/rnaseq-nets
# ---------------------------------------------------------------------------
IMAGE_REPO=ghcr.io/reproduciblebioinformatics/rnaseq-nets

# tags produced by the workflow
TAG_STD=latest
TAG_DIND=dind

# versions used only when building locally (./start.sh --build)
R_VERSION=4.6.1
DIND_IMAGE=docker:29-dind
