name: build-and-push-images

# Builds the two images and pushes them to the GitHub Container Registry
# (ghcr.io/<owner>/rnaseq-nets:latest and :dind).
# Nothing to configure: GITHUB_TOKEN is enough to push to ghcr.io.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dind'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dind'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      build_dind:
        description: 'Also build the docker-in-docker variant'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  R_VERSION: "4.6.1"          # current R release (2026-06-24)
  DIND_IMAGE: "docker:29-dind" # official docker-in-docker image

jobs:
  # -------------------------------------------------------------------------
  base:
    name: base image (RStudio + R packages)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io requires a lowercase name; the image is named after the repo
      # itself (owner/repository), so nothing has to be edited here.
      - name: Compute the image name
        id: img
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # the image is several GB: the default runner disk is not enough
      - name: Free disk space on the runner
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build (and push) the base image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            R_VERSION=${{ env.R_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test (all packages must load)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          else
            IMG="${{ steps.img.outputs.ref }}:sha-${{ steps.img.outputs.sha }}"
            docker pull "$IMG"
          fi
          docker run --rm -v "$PWD/scripts:/scripts:ro" "$IMG" \
            Rscript /scripts/00_check_installation.R

      - name: Export the image reference
        id: out
        run: |
          echo "image=${{ steps.img.outputs.ref }}:sha-${{ steps.img.outputs.sha }}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  dind:
    name: docker-in-docker variant
    needs: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io requires a lowercase name; the image is named after the repo
      # itself (owner/repository), so nothing has to be edited here.
      - name: Compute the image name
        id: img
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (dind)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=dind,enable={{is_default_branch}}
            type=semver,pattern={{version}}-dind
            type=sha,format=short,prefix=dind-

      - name: Build and push the dind image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dind
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}
            DIND_IMAGE=${{ env.DIND_IMAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.img.outputs.ref }}:latest"
            echo "docker pull ${{ steps.img.outputs.ref }}:dind"
            echo '```'
            echo ""
            echo "Put this line in \`image.conf\` so that the launcher scripts find them:"
            echo ""
            echo '```'
            echo "IMAGE_REPO=${{ steps.img.outputs.ref }}"
            echo '```'
            echo ""
            echo "Remember to set the package visibility to **public**:"
            echo "repository > Packages > Package settings > Change visibility."
          } >> "$GITHUB_STEP_SUMMARY"
